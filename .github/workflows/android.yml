name: Android APK

on:
  workflow_dispatch:
  push:
    paths: ["android/**", "backend/scalper/**", "frontend/src/**", "config/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build web UI
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # Chaquopy needs a build Python matching the app's Python version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Build release APK
        working-directory: android
        env:
          SCALPER_BUILD_PYTHON: python3.11
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: scalping-terminal-apk
          path: android/app/build/outputs/apk/release/app-release.apk
