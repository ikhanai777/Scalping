[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scalper"
version = "0.1.0"
description = "Free, open-source Binance scalping terminal: signals, trend catcher, pump/dump radar, news"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "starlette>=0.37",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "httpx>=0.27",
  "numpy>=1.26",
  "pyyaml>=6",
  "certifi",
  "feedparser>=6",
  "vaderSentiment>=3.3",
  "pandas>=2.1",
  "pyarrow>=15",
]

[project.optional-dependencies]
ml = ["lightgbm>=4", "scikit-learn>=1.4", "joblib>=1.3"]
nlp = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "TA-Lib>=0.4.28", "lightgbm>=4", "scikit-learn>=1.4", "joblib>=1.3"]

[project.scripts]
scalper = "scalper.cli:main"

[tool.setuptools.packages.find]
include = ["scalper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
